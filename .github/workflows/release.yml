name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Kept here, not in a script: the Claude plugin directory refuses script files
      # from organizations it hasn't verified.
      - name: Build downloads
        shell: bash
        run: |
          set -euo pipefail
          dist="$PWD/dist"

          # Claude and ChatGPT read different manifests; a release must not ship them out of step.
          chatgpt_version="$(jq -r .version plugin.json)"
          claude_version="$(jq -r .version .claude-plugin/plugin.json)"
          if [ "$chatgpt_version" != "$claude_version" ]; then
            echo "plugin.json is $chatgpt_version but .claude-plugin/plugin.json is $claude_version" >&2
            exit 1
          fi

          rm -rf "$dist"
          mkdir -p "$dist/skills"

          instructions="$dist/nexus-instructions.md"
          cat > "$instructions" <<'EOF'
          # Nexus workflows

          You are connected to Nexus, a freight brokerage TMS, and iTracker live tracking through the Nexus connector. Every call runs as the signed-in user with that user's permissions. iTracker is read-only. Before any change in Nexus, state exactly what will change and wait for the user's explicit confirmation.

          EOF

          for dir in skills/*/; do
            name="$(basename "$dir")"
            (cd "$dir" && zip -qr "$dist/skills/$name.zip" .)

            # Drop the YAML frontmatter; the body is the instructions.
            awk 'BEGIN { fm = 0 } NR == 1 && /^---$/ { fm = 1; next } fm && /^---$/ { fm = 0; next } !fm' "$dir/SKILL.md" >> "$instructions"
            printf '\n' >> "$instructions"
          done

          zip -qr "$dist/nexus-tms-chatgpt.zip" plugin.json mcp.json skills assets LICENSE
          echo "Built $(ls "$dist/skills" | wc -l | tr -d ' ') skill zips, nexus-instructions.md and nexus-tms-chatgpt.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body: The ChatGPT plugin package, single skill zips and the instructions file for Gemini. Claude installs the plugin straight from this repository.
          files: |
            dist/nexus-tms-chatgpt.zip
            dist/skills/*.zip
            dist/nexus-instructions.md

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build downloads
        run: bash scripts/package.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "The ChatGPT plugin package, single skill zips and the instructions file for Gemini. Claude installs the plugin straight from this repository." \
            dist/nexus-tms-chatgpt.zip dist/skills/*.zip dist/nexus-instructions.md
